{% extends "base.html" %}

{% block title %}Delete recipe{% endblock %}

{% block content %}

  <h1>Delete recipe</h1>
  <p>Are you sure you want to delete "{{ recipe.title }}"?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" >Yes, delete</button>
    <a href="{% url 'recipe_list' %}" >Cancel</a>
  </form>

{% endblock %}
