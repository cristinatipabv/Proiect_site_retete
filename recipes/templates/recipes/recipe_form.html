{% extends "base.html" %}

{% block title %}Create recipe{% endblock %}

{% block content %}

  <h1>Recipe Form</h1>

  <form method="post" enctype="multipart/form-data" >
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
    <a href="{% url 'recipe_list' %}" >Cancel</a>
  </form>

{% endblock %}
