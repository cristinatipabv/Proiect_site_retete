<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
<!--  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">-->

    <title>{% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@intergrav/dev.css@4"/>
  <link rel="stylesheet" href="/static/main.css"/>

</head>
<body>

  <nav class="navigation_bar">
    <div class="nav-left">
        <a href="{% url 'recipe_list' %}" class="nav-logo">🍰 Dulciuri</a>

        <div class="nav-links">
            <a href="{% url 'recipe_list' %}">Acasa</a>
            <a href="{% url 'create_recipe' %}">Adauga Rețeta</a>
            <a href="{% url 'check_recipe_count' %}">Statistici</a>
        </div>
    </div>

    <div class="nav-right">
        {% if user.is_authenticated %}
            <span class="welcome-text">Buna, <strong>{{ user.username }}</strong></span>
            <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
        {% else %}
            <a href="{% url 'login' %}" class="nav-btn">Login</a>
            <a href="{% url 'register' %}" class="nav-btn register-btn">Register</a>
        {% endif %}
    </div>

  </nav>

  <main>
    {% block content %}
      <!--Child templates-->
    {% endblock %}
  </main>

</body>
</html>
